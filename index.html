<html lang="nl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wielerveiling 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;font-size:15px;line-height:1.5}
:root{
  --bg:#f5f5f3;--bg1:#ffffff;--bg2:#f1efe8;--bg3:#e8e6df;
  --t1:#1a1a18;--t2:#5f5e5a;--t3:#888780;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --r:8px;--rl:12px;--accent:#534AB7;
}
@media(prefers-color-scheme:dark){
  body{background:#1a1a18;color:#e8e6df}
  :root{--bg:#1a1a18;--bg1:#242422;--bg2:#2c2c2a;--bg3:#383836;--t1:#e8e6df;--t2:#888780;--t3:#5f5e5a;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18)}
}
button{font-family:inherit;cursor:pointer;font-size:14px;transition:opacity .15s}
button:hover{opacity:.8}
input,select,textarea{font-family:inherit;background:var(--bg1);color:var(--t1);border:0.5px solid var(--border2);border-radius:var(--r);outline:none;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #534AB722}
input::placeholder{color:var(--t3)}
.app{max-width:760px;margin:0 auto;padding:0 16px 80px}
.header{padding:20px 0 14px}
.header h1{font-size:20px;font-weight:500}
.header .sub{font-size:12px;color:var(--t2);margin-top:2px}
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:10px 16px;font-size:14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--t2);white-space:nowrap;margin-bottom:-1px;font-weight:400}
.tab.active{border-bottom-color:var(--t1);color:var(--t1);font-weight:500}
.card{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 12px;text-align:left;font-weight:500;color:var(--t2);font-size:12px;background:var(--bg2);border-bottom:0.5px solid var(--border)}
.tbl td{padding:8px 12px;font-size:13px;border-top:0.5px solid var(--border)}
.tbl tr:nth-child(even) td{background:var(--bg2)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.c,.tbl td.c{text-align:center}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:2px 7px;font-weight:500;line-height:1.6}
.btn{padding:7px 16px;border-radius:var(--r);border:0.5px solid var(--border2);background:transparent;color:var(--t1)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:#D85A30;border-color:#D85A30}
.pill{padding:5px 14px;border-radius:20px;font-size:13px;border:0.5px solid var(--border2);background:transparent;color:var(--t2)}
.pill.active{border:none;color:#fff;font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:var(--r);padding:12px;text-align:center}
.stat .label{font-size:11px;color:var(--t2);margin-bottom:3px}
.stat .value{font-size:22px;font-weight:500}
.bar-wrap{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin:6px 0 10px}
.bar{height:100%;transition:width .5s ease}
.meta{display:flex;gap:14px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.meta b{color:var(--t1);font-weight:500}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:var(--t2);font-size:13px;margin-bottom:14px;background:none;border:none;padding:0}
.nav-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.race-item{border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.race-hdr{padding:12px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:12px}
.race-hdr:hover{background:var(--bg3)}
.race-hdr-left{flex:1;min-width:0}
.race-title{font-weight:500;font-size:14px}
.race-meta{font-size:11px;color:var(--t2);margin-top:2px}
.race-status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.status-done{background:#1D9E7522;color:#1D9E75}
.status-partial{background:#BA751722;color:#BA7517}
.status-empty{background:var(--bg3);color:var(--t3)}
.chevron{font-size:11px;color:var(--t2);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.section-label{font-size:11px;font-weight:600;color:var(--t2);letter-spacing:.05em;padding:10px 14px 4px;background:var(--bg2);border-top:0.5px solid var(--border)}
.slot-row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:0.5px solid var(--border)}
.slot-row:nth-child(even){background:var(--bg2)}
.slot-pts{font-size:12px;color:var(--t2);min-width:36px;text-align:right}
.slot-pos{font-size:12px;color:var(--t3);min-width:28px}
.slot-input{flex:1;padding:5px 8px;font-size:13px;border-radius:6px}
.slot-rider{flex:1;font-size:13px;font-weight:400}
.slot-mgr{margin-left:6px}
.highlight td{background:#534AB71a!important}
.dnf-badge{font-size:11px;background:#D85A3022;color:#D85A30;border-radius:4px;padding:2px 7px;cursor:help;white-space:nowrap}
.jersey{width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden;cursor:pointer}
.jersey input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.jersey img{width:100%;height:100%;object-fit:cover}
.jersey-edit-wrap{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.jersey-abbr{font-size:11px;color:var(--t2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg1);border-radius:var(--rl);padding:20px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:500;margin-bottom:4px}
.modal .modal-sub{font-size:12px;color:var(--t2);margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.form-row input,.form-row select{width:100%;padding:8px 10px}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.feed-msg{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px 16px;margin-bottom:8px}
.feed-who{font-size:12px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.feed-when{font-size:11px;color:var(--t3);font-weight:400}
.feed-text{font-size:14px;line-height:1.5;white-space:pre-wrap}
.compose{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:18px}
.compose-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}
.empty .icon{font-size:28px;margin-bottom:8px}
.tbl-wrap{border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.admin-list-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:0.5px solid var(--border);font-size:13px}
.admin-list-row:first-child{border-top:none}
.admin-list-row:nth-child(even){background:var(--bg2)}
.tag{display:inline-block;font-size:10px;border-radius:3px;padding:1px 6px;font-weight:500}
.tooltip{position:relative;display:inline-block}
.tooltip .tip{visibility:hidden;background:#333;color:#fff;font-size:11px;border-radius:4px;padding:4px 8px;position:absolute;bottom:125%;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.tooltip:hover .tip{visibility:visible;opacity:1}
</style>

// ============================================================
// STATE
// ============================================================
function loadState() {
  try {
    const saved = localStorage.getItem('wv26_state');
    if (saved) {
      const s = JSON.parse(saved);
      // Merge: always use fresh RACES_DATA structure but overlay saved rider names
      const races = JSON.parse(JSON.stringify(RACES_DATA));
      if (s.raceResults) {
        races.forEach(race => {
          const saved_race = s.raceResults[race.name];
          if (!saved_race) return;
          race.stages.forEach((slot, i) => {
            if (saved_race.stages && saved_race.stages[i] !== undefined) slot.rider = saved_race.stages[i];
          });
          race.finals.forEach((slot, i) => {
            if (saved_race.finals && saved_race.finals[i] !== undefined) slot.rider = saved_race.finals[i];
          });
          if (saved_race.dnfs) race.dnfs = saved_race.dnfs;
          if (saved_race.specials) {
            race.specials.forEach((sl, i) => {
              if (saved_race.specials[i] !== undefined) sl.rider = saved_race.specials[i];
            });
          }
        });
      }
      return {
        races,
        riderTeams: s.riderTeams || {},
        teamColors: s.teamColors || {},
        teamAbbr: s.teamAbbr || {},
        jerseyImages: s.jerseyImages || {},
        comments: s.comments || [],
      };
    }
  } catch(e) {}
  return {
    races: JSON.parse(JSON.stringify(RACES_DATA)),
    riderTeams: {}, teamColors: {}, teamAbbr: {}, jerseyImages: {}, comments: []
  };
}

let S = loadState();

function saveState() {
  // Only save rider names (not full structure) to keep storage small
  const raceResults = {};
  S.races.forEach(race => {
    raceResults[race.name] = {
      stages: race.stages.map(s => s.rider || null),
      finals: race.finals.map(f => f.rider || null),
      specials: race.specials.map(sp => sp.rider || null),
      dnfs: race.dnfs || [],
    };
  });
  localStorage.setItem('wv26_state', JSON.stringify({
    raceResults,
    riderTeams: S.riderTeams,
    teamColors: S.teamColors,
    teamAbbr: S.teamAbbr,
    jerseyImages: S.jerseyImages,
    comments: S.comments,
  }));
}

// ============================================================
// COMPUTED
// ============================================================
function getRiderPoints() {
  const pts = {}, dnfs = {}, dnfRaces = {};
  RIDERS_INITIAL.forEach(r => { pts[r.name] = 0; dnfs[r.name] = 0; dnfRaces[r.name] = []; });

  S.races.forEach(race => {
    [...(race.stages||[]), ...(race.finals||[]), ...(race.specials||[])].forEach(e => {
      if (!e.rider || !e.pts) return;
      const key = fuzzyFind(e.rider);
      if (key) pts[key] = (pts[key]||0) + e.pts;
    });
    (race.dnfs||[]).forEach(name => {
      const key = fuzzyFind(name);
      if (key) { dnfs[key] = (dnfs[key]||0)+1; dnfRaces[key] = dnfRaces[key]||[]; dnfRaces[key].push(race.name); }
    });
  });
  return { pts, dnfs, dnfRaces };
}

function fuzzyFind(name) {
  if (!name) return null;
  const clean = name.trim();
  // exact
  if (RIDERS_INITIAL.find(r => r.name === clean)) return clean;
  // first+last match (case insensitive)
  const parts = clean.toLowerCase().split(' ').filter(Boolean);
  const match = RIDERS_INITIAL.find(r => {
    const rp = r.name.toLowerCase().split(' ').filter(Boolean);
    return rp[0] === parts[0] && rp[rp.length-1] === parts[parts.length-1];
  });
  return match ? match.name : null;
}

function getRiderManager(name) {
  const key = fuzzyFind(name);
  if (key) return RIDERS_INITIAL.find(r => r.name === key)?.manager || null;
  return null;
}

function getTeamForRider(riderName) {
  if (S.riderTeams[riderName]) return S.riderTeams[riderName];
  const key = fuzzyFind(riderName) || riderName;
  return RIDER_TEAM_DEFAULT[key] || 'default';
}

function getTeamColor(team) {
  if (S.teamColors[team]) return S.teamColors[team];
  return DEFAULT_TEAM_COLORS[team] || DEFAULT_TEAM_COLORS.default;
}

function getTeamAbbr(team) {
  if (S.teamAbbr[team]) return S.teamAbbr[team];
  return team.substring(0,2).toUpperCase();
}

function calcStandings() {
  const { pts, dnfs } = getRiderPoints();
  return MANAGERS.map(m => {
    const mine = RIDERS_INITIAL.filter(r => r.manager === m);
    const total = mine.reduce((s,r) => s+(pts[r.name]||0), 0);
    const totalDnf = mine.reduce((s,r) => s+(dnfs[r.name]||0), 0);
    const cost = mine.reduce((s,r) => s+r.cost, 0);
    return { name:m, pts:total, dnfs:totalDnf, cost, riders:mine };
  }).sort((a,b) => b.pts - a.pts);
}

function raceStatus(race) {
  const all = [...(race.stages||[]), ...(race.finals||[])];
  if (!all.length) return 'empty';
  const filled = all.filter(e => e.rider).length;
  if (filled === 0) return 'empty';
  if (filled === all.length) return 'done';
  return 'partial';
}

let UI = { tab:'stand', teamView:null, highlightRider:null, raceOpen:{}, modal:null, modalData:null };

function navigate(tab, extra={}) {
  UI.tab = tab;
  UI.teamView = extra.teamView || null;
  UI.highlightRider = extra.highlightRider || null;
  if (!extra.keepOpen) UI.raceOpen = {};
  render();
}

// ============================================================
// RENDER
// ============================================================
function el(tag, cls) { const e = document.createElement(tag); if(cls) e.className=cls; return e; }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Header
  const hdr = el('div','header');
  hdr.innerHTML = '<h1>🚴 Wielerveiling 2026</h1><div class="sub">Fantasy wielrennen &bull; 8 managers</div>';
  app.appendChild(hdr);

  // Tabs
  const tabBar = el('div','tabs');
  [['stand','🏆 Stand'],['teams','👥 Teams'],['races','🗺 Races'],['feed','💬 Feed'],['admin','⚙️ Admin']].forEach(([id,label]) => {
    const t = el('button','tab'+(UI.tab===id?' active':''));
    t.textContent = label;
    t.onclick = () => navigate(id);
    tabBar.appendChild(t);
  });
  app.appendChild(tabBar);

  const body = el('div','');
  if (UI.tab==='stand') renderStand(body);
  else if (UI.tab==='teams') renderTeams(body);
  else if (UI.tab==='races') renderRaces(body);
  else if (UI.tab==='feed') renderFeed(body);
  else if (UI.tab==='admin') renderAdmin(body);
  app.appendChild(body);

  if (UI.modal) renderModal(app);
}

function renderStand(c) {
  const standings = calcStandings();
  const max = standings[0]?.pts || 1;
  standings.forEach((m, idx) => {
    const card = el('div','card');
    card.style.cursor = 'pointer';
    card.onclick = () => navigate('teams', {teamView: m.name});
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span style="font-size:13px;color:var(--t2);min-width:22px;font-weight:500">#${idx+1}</span>
        <div style="width:32px;height:32px;border-radius:50%;background:${COLORS[m.name]}22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:${COLORS[m.name]}">${m.name[0]}</div>
        <span style="font-weight:500;font-size:16px;flex:1">${m.name}</span>
        <span style="font-size:22px;font-weight:500;color:${COLORS[m.name]}">${m.pts}</span>
        <span style="font-size:13px;color:var(--t2)">pts</span>
      </div>
      <div class="bar-wrap"><div class="bar" style="width:${max?((m.pts/max)*100):0}%;background:${COLORS[m.name]}"></div></div>
      <div class="meta">
        <span>Budget: <b>${m.cost.toFixed(1)}M</b></span>
        <span>DNFs: <b style="color:${m.dnfs>0?'#D85A30':'var(--t1)'}">${m.dnfs}</b></span>
        <span style="margin-left:auto;color:var(--t3);font-size:12px">${m.riders.length} renners ›</span>

    c.appendChild(card);
  });
}

    <th class="r">Punten</th>

    const color = getTeamColor(team);

        const team = inp.dataset.team;

        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => { S.jerseyImages[team] = ev.target.result; saveState(); render(); };

      });
    });
    document.querySelectorAll('[data-edit-team]').forEach(el => {
      el.onclick = () => {
        const team = el.dataset.editTeam;
        UI.modal = 'editTeam';

      };

// ---- RACES ----
function renderRaces(c) {
  S.races.forEach(race => {
    const wrap = el('div','race-item');
    const status = raceStatus(race);
    const isOpen = UI.raceOpen[race.name];
    const allEntries = [...(race.stages||[]), ...(race.finals||[])];
    const filled = allEntries.filter(e=>e.rider).length;
    const total = allEntries.length;
    const dnfCount = (race.dnfs||[]).length;

    const hdr = el('div','race-hdr');
    hdr.innerHTML = `
      <div class="race-hdr-left">
        <div class="race-title">${race.name}</div>
        <div class="race-meta">${race.start||'?'}${race.end?' → '+race.end:''} &bull; ${filled}/${total} ingevuld${dnfCount?' &bull; '+dnfCount+' DNF':''}</div>
      </div>
      <span class="race-status ${status==='done'?'status-done':status==='partial'?'status-partial':'status-empty'}">${status==='done'?'✓ Klaar':status==='partial'?'Bezig':'Leeg'}</span>
      <span class="chevron${isOpen?' open':''}">▼</span>`;
    hdr.onclick = () => { UI.raceOpen[race.name]=!isOpen; render(); };
    wrap.appendChild(hdr);

    if (isOpen) {
      // Group stages by stage number
      const stageGroups = {};
      (race.stages||[]).forEach(s => {
        const key = s.stage !== null ? s.stage : '_';
        if (!stageGroups[key]) stageGroups[key] = [];
        stageGroups[key].push(s);
      });

      if (Object.keys(stageGroups).length > 0) {
        const hasMultipleStages = Object.keys(stageGroups).length > 1 || Object.keys(stageGroups)[0] !== '_';
        if (hasMultipleStages) {
          Object.entries(stageGroups).forEach(([stageNum, slots]) => {
            const lbl = el('div','section-label');
            lbl.textContent = stageNum === '_' ? 'UITSLAG' : `ETAPPE ${stageNum}`;
            wrap.appendChild(lbl);
            renderSlots(wrap, slots, race);
          });
        } else {
          const lbl = el('div','section-label');
          lbl.textContent = 'UITSLAG';
          wrap.appendChild(lbl);
          renderSlots(wrap, race.stages, race);
        }
      }

      if ((race.finals||[]).length > 0) {
        const lbl = el('div','section-label');
        lbl.textContent = 'EINDKLASSEMENT';
        wrap.appendChild(lbl);
        renderSlots(wrap, race.finals, race);
      }

      if ((race.specials||[]).length > 0) {
        const lbl = el('div','section-label');
        lbl.textContent = 'SPECIALE KLASSEMENTEN';
        wrap.appendChild(lbl);
        renderSlots(wrap, race.specials, race);
      }

      // DNF section
      const dnfLbl = el('div','section-label');
      dnfLbl.innerHTML = `DNFs <button class="btn" style="font-size:11px;padding:2px 8px;margin-left:8px" id="add-dnf-${race.name.replace(/\s/g,'_')}">+ Voeg toe</button>`;
      wrap.appendChild(dnfLbl);

      if ((race.dnfs||[]).length > 0) {
        race.dnfs.forEach((name, i) => {
          const row = el('div','slot-row');
          const mgr = getRiderManager(name);
          row.innerHTML = `
            <span class="slot-pos" style="color:#D85A30">DNF</span>
            <span class="slot-rider">${name}${mgr?` <span class="badge" style="background:${COLORS[mgr]}22;color:${COLORS[mgr]}">${mgr}</span>`:''}</span>
            <button class="btn danger" style="font-size:11px;padding:2px 8px" data-dnf-remove="${i}" data-race="${race.name}">✕</button>`;
          wrap.appendChild(row);
        });
      } else {
        const row = el('div','slot-row');
        row.innerHTML = '<span style="color:var(--t3);font-size:12px">Geen DNFs</span>';
        wrap.appendChild(row);
      }

      const spacer = el('div',''); spacer.style.height='8px';
      wrap.appendChild(spacer);
    }

    c.appendChild(wrap);
  });

  // Wire DNF buttons after render
  setTimeout(() => {
    document.querySelectorAll('[data-dnf-remove]').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const raceName = btn.dataset.race;
        const idx = parseInt(btn.dataset.dnfRemove);
        const race = S.races.find(r => r.name === raceName);
        if (race) { race.dnfs.splice(idx,1); saveState(); render(); }
      };
    });
    document.querySelectorAll('[id^="add-dnf-"]').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const raceName = btn.id.replace('add-dnf-','').replace(/_/g,' ');
        const name = prompt('Naam van de renner (DNF):');
        if (!name) return;
        const race = S.races.find(r => r.name === raceName);
        if (race) { race.dnfs = race.dnfs||[]; race.dnfs.push(name.trim()); saveState(); render(); }
      };
    });
  }, 0);
}

function renderSlots(parent, slots, race) {
  slots.forEach((slot, globalIdx) => {
    const row = el('div','slot-row');
    const label = slot.pos !== undefined ? `${slot.pos||''}` : (slot.label || '');
    const mgr = slot.rider ? getRiderManager(slot.rider) : null;

    const posSpan = `<span class="slot-pos">${label}</span>`;
    const ptsSpan = `<span class="slot-pts">${slot.pts||0} pt</span>`;

    if (slot.rider) {
      // Filled — show rider + click to navigate
      row.innerHTML = `${posSpan}
        <span class="slot-rider" style="cursor:pointer;text-decoration:underline dotted" data-rider="${slot.rider}" data-race="${race.name}">${slot.rider}
          ${mgr?`<span class="badge" style="background:${COLORS[mgr]}22;color:${COLORS[mgr]};margin-left:4px">${mgr}</span>`:''}
        </span>
        ${ptsSpan}
        <button class="btn" style="font-size:11px;padding:2px 8px;flex-shrink:0" data-clear-slot data-race="${race.name}" data-slot-type="${slot.pos!==undefined?'finals':'stages'}" data-slot-idx="${globalIdx}">✕</button>`;
    } else {
      // Empty — show input
      const inp = el('input','slot-input');
      inp.placeholder = 'Renner naam...';
      inp.setAttribute('data-race', race.name);
      inp.setAttribute('data-slot-type', slot.pos!==undefined?'finals':'stages');
      inp.setAttribute('data-slot-idx', globalIdx);
      inp.setAttribute('list', 'rider-names');
      inp.value = '';

      // Build row manually
      const posEl = el('span','slot-pos'); posEl.textContent = label;
      const ptsEl = el('span','slot-pts'); ptsEl.textContent = `${slot.pts||0} pt`;
      row.appendChild(posEl);
      row.appendChild(inp);
      row.appendChild(ptsEl);
    }

    parent.appendChild(row);
  });

  // Wire after render
  setTimeout(() => {
    // Navigate on rider click
    parent.querySelectorAll('[data-rider]').forEach(el => {
      el.onclick = () => {
        const rider = el.dataset.rider;
        const mgr = getRiderManager(rider);
        if (mgr) navigate('teams', {teamView: mgr, highlightRider: rider});
      };
    });

    // Clear slot
    parent.querySelectorAll('[data-clear-slot]').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const raceName = btn.dataset.race;
        const type = btn.dataset.slotType;
        const idx = parseInt(btn.dataset.slotIdx);
        const race = S.races.find(r => r.name === raceName);
        if (race && race[type] && race[type][idx]) {
          race[type][idx].rider = null;
          saveState();
          UI.raceOpen[raceName] = true;
          render();
        }
      };
    });

    // Input save on Enter or blur
    parent.querySelectorAll('input.slot-input').forEach(inp => {
      const save = () => {
        const val = inp.value.trim();
        if (!val) return;
        const raceName = inp.dataset.race;
        const type = inp.dataset.slotType;
        const idx = parseInt(inp.dataset.slotIdx);
        const race = S.races.find(r => r.name === raceName);
        if (race && race[type] && race[type][idx] !== undefined) {
          race[type][idx].rider = val;
          saveState();
          UI.raceOpen[raceName] = true;
          render();
        }
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
      inp.addEventListener('blur', save);
    });
  }, 0);
}

// ---- FEED ----
function renderFeed(c) {
  const compose = el('div','compose');
  compose.innerHTML = `
    <div style="font-size:13px;font-weight:500;margin-bottom:10px">Nieuw bericht</div>
    <div class="compose-row">
      <select id="feed-who" style="flex:1;padding:7px 10px">
        <option value="">Kies naam...</option>
        ${MANAGERS.map(m=>`<option value="${m}">${m}</option>`).join('')}
      </select>
    </div>
    <textarea id="feed-text" style="width:100%;padding:8px 10px;margin-bottom:8px;font-size:14px;min-height:70px;border-radius:var(--r);resize:vertical" placeholder="Schrijf een bericht..."></textarea>
    <button class="btn primary" id="feed-post">Versturen</button>`;
  c.appendChild(compose);

  if (S.comments.length === 0) {
    const empty = el('div','empty');
    empty.innerHTML = '<div class="icon">💬</div><div>Nog geen berichten.</div>';
    c.appendChild(empty);
  } else {
    S.comments.forEach(msg => {
      const d = el('div','feed-msg');
      d.innerHTML = `
        <div class="feed-who"><span style="color:${COLORS[msg.who]||'var(--t1)'}">${msg.who}</span><span class="feed-when">${msg.time}</span></div>
        <div class="feed-text">${msg.text.replace(/</g,'&lt;')}</div>`;
      c.appendChild(d);
    });
  }

  setTimeout(() => {
    document.getElementById('feed-post').onclick = () => {
      const who = document.getElementById('feed-who').value;
      const text = document.getElementById('feed-text').value.trim();
      if (!who || !text) { alert('Kies een naam en schrijf een bericht.'); return; }
      S.comments.unshift({ who, text, time: new Date().toLocaleString('nl-NL') });
      saveState();
      render();
    };
  }, 0);
}

// ---- ADMIN ----
function renderAdmin(c) {
  c.innerHTML = `<div style="font-size:13px;color:var(--t2);margin-bottom:16px">Pas team-afkortingen en kleuren aan, of reset alle data.</div>`;

  const teamSection = el('div','card');
  teamSection.innerHTML = `<div style="font-weight:500;margin-bottom:12px;font-size:14px">Teams bewerken</div>`;
  const teamList = el('div','');
  const usedTeams = [...new Set(RIDERS_INITIAL.map(r => getTeamForRider(r.name)))].sort();
  usedTeams.forEach(team => {
    const color = getTeamColor(team);
    const abbr = getTeamAbbr(team);
    const row = el('div','');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 0;border-top:0.5px solid var(--border)';
    row.innerHTML = `
      <div style="width:28px;height:28px;border-radius:4px;background:${color};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0">${abbr}</div>
      <span style="flex:1;font-size:13px">${team}</span>
      <button class="btn" style="font-size:12px;padding:4px 10px" data-edit-team="${team}">Bewerk</button>`;
    teamList.appendChild(row);
  });
  teamSection.appendChild(teamList);
  c.appendChild(teamSection);

  const resetSection = el('div','card');
  resetSection.style.marginTop = '12px';
  resetSection.innerHTML = `
    <div style="font-weight:500;margin-bottom:8px;font-size:14px">Data beheer</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:12px">Reset alle ingevulde resultaten en keer terug naar de beginsituatie.</div>
    <button class="btn danger" id="reset-btn">⚠️ Reset alle resultaten</button>`;
  c.appendChild(resetSection);

  setTimeout(() => {
    document.querySelectorAll('[data-edit-team]').forEach(btn => {
      btn.onclick = () => { UI.modal='editTeam'; UI.modalData={team:btn.dataset.editTeam}; render(); };
    });
    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) resetBtn.onclick = () => {
      if (confirm('Weet je zeker dat je alle resultaten wilt wissen? Dit kan niet ongedaan worden gemaakt.')) {
        localStorage.removeItem('wv26_state');
        S = loadState();
        render();
      }
    };
  }, 0);
}

// ---- MODAL ----
function renderModal(app) {
  const bg = el('div','modal-bg');
  bg.onclick = e => { if(e.target===bg){UI.modal=null;render();} };
  const modal = el('div','modal');

  if (UI.modal === 'editTeam') {
    const { team } = UI.modalData;
    const color = getTeamColor(team);
    const abbr = getTeamAbbr(team);
    modal.innerHTML = `
      <h2>Team bewerken</h2>
      <div class="modal-sub">${team}</div>
      <div class="form-row"><label>Afkorting (2-3 letters)</label><input id="m-abbr" value="${abbr}" maxlength="4" style="text-transform:uppercase"></div>
      <div class="form-row"><label>Kleur</label><input type="color" id="m-color" value="${color}" style="width:100%;height:40px;padding:2px"></div>
      <div class="form-row">
        <label>Jersey afbeelding</label>
        <input type="file" id="m-jersey" accept="image/*" style="padding:6px">
        ${S.jerseyImages[team] ? `<div style="margin-top:6px"><img src="${S.jerseyImages[team]}" style="height:40px;border-radius:4px"> <button class="btn danger" style="font-size:11px;padding:2px 8px" id="remove-jersey">Verwijder</button></div>` : ''}
      </div>
      <div class="btn-row">
        <button class="btn primary" id="save-team">Opslaan</button>
        <button class="btn" id="cancel-team">Annuleren</button>
      </div>`;

    bg.appendChild(modal);
    app.appendChild(bg);

    setTimeout(() => {
      document.getElementById('save-team').onclick = () => {
        const abbr = document.getElementById('m-abbr').value.trim().toUpperCase().substring(0,4);
        const color = document.getElementById('m-color').value;
        if (abbr) S.teamAbbr[team] = abbr;
        S.teamColors[team] = color;
        const fileInput = document.getElementById('m-jersey');
        if (fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = ev => { S.jerseyImages[team] = ev.target.result; saveState(); UI.modal=null; render(); };
          reader.readAsDataURL(fileInput.files[0]);
        } else { saveState(); UI.modal=null; render(); }
      };
      document.getElementById('cancel-team').onclick = () => { UI.modal=null; render(); };
      const rj = document.getElementById('remove-jersey');
      if (rj) rj.onclick = () => { delete S.jerseyImages[team]; saveState(); UI.modal=null; render(); };
    }, 0);
    return;
  }

  bg.appendChild(modal);
  app.appendChild(bg);
}

// ---- DATALIST for autocomplete ----
const dl = document.createElement('datalist');
dl.id = 'rider-names';
RIDERS_INITIAL.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r.name;
  dl.appendChild(opt);
});
document.body.appendChild(dl);

// ---- INIT ----
render();
</script>
