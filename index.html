<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wielerveiling 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;font-size:15px;line-height:1.5}
:root{
  --bg:#f5f5f3;--bg1:#ffffff;--bg2:#f1efe8;--bg3:#e8e6df;
  --t1:#1a1a18;--t2:#5f5e5a;--t3:#888780;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  body{background:#1a1a18;color:#e8e6df}
  :root{--bg:#1a1a18;--bg1:#242422;--bg2:#2c2c2a;--bg3:#383836;--t1:#e8e6df;--t2:#888780;--t3:#5f5e5a;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15)}
}
button{font-family:inherit;cursor:pointer;font-size:14px}
input,select,textarea{font-family:inherit;background:var(--bg1);color:var(--t1);border:0.5px solid var(--border2);border-radius:var(--r);outline:none;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:#534AB7;box-shadow:0 0 0 2px #534AB722}
a{color:inherit;text-decoration:none}
.app{max-width:760px;margin:0 auto;padding:0 16px 80px}
.header{padding:22px 0 14px;border-bottom:0.5px solid var(--border);margin-bottom:0}
.header h1{font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.header .sub{font-size:12px;color:var(--t2);margin-top:3px}
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:11px 18px;font-size:14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--t2);font-weight:400;white-space:nowrap;margin-bottom:-1px;transition:color .15s}
.tab.active{border-bottom-color:var(--t1);color:var(--t1);font-weight:500}
.tab:hover{color:var(--t1)}
.card{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:10px}
.card:last-child{margin-bottom:0}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:9px 14px;text-align:left;font-weight:500;color:var(--t2);font-size:12px;background:var(--bg2);border-bottom:0.5px solid var(--border)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.c,.tbl td.c{text-align:center}
.tbl td{padding:9px 14px;font-size:13px;border-top:0.5px solid var(--border)}
.tbl tr:nth-child(even) td{background:var(--bg2)}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:2px 7px;font-weight:500}
.btn{padding:7px 16px;border-radius:var(--r);border:0.5px solid var(--border2);background:transparent;color:var(--t1);transition:background .15s}
.btn:hover{background:var(--bg2)}
.btn.primary{background:#534AB7;color:#fff;border-color:#534AB7}
.btn.primary:hover{background:#3C3489}
.pill{padding:5px 14px;border-radius:20px;font-size:13px;border:0.5px solid var(--border2);background:transparent;color:var(--t2)}
.pill.active{border:none;color:#fff;font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg2);border-radius:var(--r);padding:12px 14px;text-align:center}
.stat .label{font-size:11px;color:var(--t2);margin-bottom:4px}
.stat .value{font-size:22px;font-weight:500}
.bar-wrap{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin:6px 0 10px}
.bar{height:100%;transition:width .5s ease}
.meta{display:flex;gap:16px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.meta b{color:var(--t1);font-weight:500}
.clickable{cursor:pointer}
.clickable:hover{opacity:.75}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-size:13px;margin-bottom:16px;background:none;border:none;padding:0;cursor:pointer}
.back-btn:hover{color:var(--t1)}
.highlight td{background:#534AB71a!important}
.dnf-badge{font-size:11px;background:#D85A3022;color:#D85A30;border-radius:4px;padding:2px 8px;cursor:help}
.team-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:4px;padding:3px 8px;font-weight:500}
.nav-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pos-badge{display:inline-block;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:500;text-align:center;line-height:22px}
.empty-state{text-align:center;padding:40px 20px;color:var(--t2)}
.feed-msg{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px 16px;margin-bottom:10px}
.feed-msg .who{font-size:12px;font-weight:500;margin-bottom:4px}
.feed-msg .when{font-size:11px;color:var(--t3);margin-left:8px;font-weight:400}
.feed-msg .text{font-size:14px;line-height:1.5;color:var(--t1)}
.compose{background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:20px}
.race-item{border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.race-header{padding:10px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.race-header:hover{background:var(--bg3)}
.race-body{padding:0}
.chevron{transition:transform .2s;font-size:12px;color:var(--t2)}
.chevron.open{transform:rotate(180deg)}
.dnf-list{font-size:12px;color:#D85A30;margin-top:3px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg1);border-radius:var(--rl);padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:500;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px}
.form-row textarea{min-height:80px;resize:vertical}
.result-entry{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.result-entry input{flex:1;padding:6px 8px}
.result-entry .pos-label{font-size:12px;color:var(--t2);min-width:24px}
hr{border:none;border-top:0.5px solid var(--border);margin:12px 0}
.jersey{width:22px;height:22px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;vertical-align:middle;margin-right:4px;flex-shrink:0;cursor:pointer;position:relative}
.jersey input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.jersey img{width:100%;height:100%;object-fit:cover;border-radius:3px}
</style>
</head>

// ============================================================
// STATE
// ============================================================
let state = {
  tab: "stand",
  teamView: null,      // null = overview, string = manager name
  highlightRider: null,
  raceOpen: {},        // race name -> bool
  adminModal: null,    // null | "addRace" | "editRace"
  editingRace: null,
  comments: JSON.parse(localStorage.getItem("wv_comments")||"[]"),
  jerseyImages: JSON.parse(localStorage.getItem("wv_jerseys")||"{}"),
  riders: JSON.parse(localStorage.getItem("wv_riders")) || RIDERS_DATA,
  races: JSON.parse(localStorage.getItem("wv_races")) || RACES_DATA,
};

function saveState() {
  localStorage.setItem("wv_comments", JSON.stringify(state.comments));
  localStorage.setItem("wv_jerseys", JSON.stringify(state.jerseyImages));
  localStorage.setItem("wv_riders", JSON.stringify(state.riders));
  localStorage.setItem("wv_races", JSON.stringify(state.races));
}

// ============================================================
// HELPERS
// ============================================================
function getRiderManager(name) {
  const r = state.riders.find(rd => rd.name === name);
  if (r) return r.manager;
  const k = state.riders.find(rd => {
    const a = rd.name.toLowerCase().split(" ");
    const b = name.toLowerCase().split(" ");
    return a[0] === b[0] && a[a.length-1] === b[b.length-1];
  });
  return k ? k.manager : null;
}

function calcStandings() {
  return MANAGERS.map(m => {
    const mine = state.riders.filter(r => r.manager === m);
    const pts = mine.reduce((s,r) => s+r.points, 0);
    const cost = mine.reduce((s,r) => s+r.cost, 0);
    const dnfs = mine.reduce((s,r) => s+r.dnf, 0);
    return {name:m, pts, cost, dnfs, riders:mine};
  }).sort((a,b) => b.pts-a.pts);
}

function fmt(n) { return n != null ? n.toLocaleString("nl-NL") : "—"; }

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  // Header
  const hdr = el("div","header");
  hdr.innerHTML = `<h1>🚴 Wielerveiling 2026</h1><div class="sub">Fantasy wielrennen &bull; 8 managers</div>`;
  app.appendChild(hdr);

  // Tabs
  const tabBar = el("div","tabs");
  [["stand","🏆 Stand"],["teams","👥 Teams"],["races","🗺 Races"],["feed","💬 Feed"],["admin","⚙️ Admin"]].forEach(([id,label]) => {
    const t = el("button","tab"+(state.tab===id?" active":""));
    t.textContent = label;
    t.onclick = () => { state.tab=id; state.teamView=null; state.highlightRider=null; render(); };
    tabBar.appendChild(t);
  });
  app.appendChild(tabBar);

  const body = el("div","");
  if (state.tab==="stand") renderStand(body);
  else if (state.tab==="teams") renderTeams(body);
  else if (state.tab==="races") renderRaces(body);
  else if (state.tab==="feed") renderFeed(body);
  else if (state.tab==="admin") renderAdmin(body);
  app.appendChild(body);

  if (state.adminModal) renderModal(app);
}

// ---- STAND ----
function renderStand(c) {
  const standings = calcStandings();
  const max = standings[0]?.pts || 1;
  standings.forEach((m, idx) => {
    const card = el("div","card clickable");
    card.onclick = () => { state.tab="teams"; state.teamView=m.name; render(); };
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span style="font-size:13px;color:var(--t2);min-width:22px;font-weight:500">#${idx+1}</span>
        <div style="width:34px;height:34px;border-radius:50%;background:${COLORS[m.name]}22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:${COLORS[m.name]}">${m.name[0]}</div>
        <span style="font-weight:500;font-size:16px;flex:1;color:${COLORS[m.name]}">${m.name}</span>
        <span style="font-size:22px;font-weight:500;color:${COLORS[m.name]}">${m.pts}</span>
        <span style="font-size:13px;color:var(--t2)">pts</span>
      </div>
      <div class="bar-wrap"><div class="bar" style="width:${(m.pts/max)*100}%;background:${COLORS[m.name]}"></div></div>
      <div class="meta">
        <span>Budget: <b>${m.cost.toFixed(1)}M</b></span>
        <span>DNFs: <b style="color:${m.dnfs>0?"#D85A30":"var(--t1)"}">${m.dnfs}</b></span>
        <span>€/pt: <b>${m.pts>0?fmt(Math.round(m.cost/m.pts*100000)):"—"}</b></span>
        <span style="margin-left:auto;color:var(--t3)">${m.riders.length} renners &rsaquo;</span>
      </div>`;
    c.appendChild(card);
  });
}

// ---- TEAMS ----

    // overview - just standings with click
    const standings = calcStandings();
    const max = standings[0]?.pts || 1;
    standings.forEach((m, idx) => {
      const card = el("div","card clickable");
      card.onclick = () => { state.teamView=m.name; render(); };
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <span style="font-size:13px;color:var(--t2);min-width:22px;font-weight:500">#${idx+1}</span>
          <div style="width:34px;height:34px;border-radius:50%;background:${COLORS[m.name]}22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:${COLORS[m.name]}">${m.name[0]}</div>
          <span style="font-weight:500;font-size:16px;flex:1">${m.name}</span>
          <span style="font-size:20px;font-weight:500;color:${COLORS[m.name]}">${m.pts}</span>

        </div>

      c.appendChild(card);
    });
    return;
  }

  // Manager roster view
  const mgr = state.teamView;
  const back = el("button","back-btn");
  back.innerHTML = "&#8592; Alle teams";
  back.onclick = () => { state.teamView=null; state.highlightRider=null; render(); };
  c.appendChild(back);

  // Nav between managers
  const nav = el("div","nav-row");
  MANAGERS.forEach(m => {
    const b = el("button","pill"+(m===mgr?" active":""));
    if (m===mgr) b.style.background = COLORS[m];
    b.textContent = m;
    b.onclick = () => { state.teamView=m; state.highlightRider=null; render(); };
    nav.appendChild(b);
  });
  c.appendChild(nav);

  const mine = state.riders.filter(r => r.manager===mgr).sort((a,b)=>b.points-a.points);
  const totalPts = mine.reduce((s,r)=>s+r.points,0);
  const totalCost = mine.reduce((s,r)=>s+r.cost,0);
  const totalDnf = mine.reduce((s,r)=>s+r.dnf,0);

  // Stats
  const sg = el("div","stat-grid");
  sg.innerHTML = `
    <div class="stat"><div class="label">Punten</div><div class="value" style="color:${COLORS[mgr]}">${totalPts}</div></div>
    <div class="stat"><div class="label">Budget</div><div class="value">${totalCost.toFixed(1)}M</div></div>
    <div class="stat"><div class="label">DNFs</div><div class="value" style="color:${totalDnf>0?"#D85A30":"var(--t1)"}">${totalDnf}</div></div>`;
  c.appendChild(sg);

  // Table
  const wrap = el("div","");
  wrap.style.cssText = "border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden";
  const tbl = el("table","tbl");
  tbl.innerHTML = `<thead><tr>
    <th style="width:36px"></th>
    <th>Renner</th>
    <th>Team</th>
    <th class="r">Prijs</th>
    <th class="r">Punten</th>
    <th class="r">€/pt</th>
    <th class="c">DNF</th>
  </tr></thead>`;
  const tbody = el("tbody","");
  mine.forEach(r => {
    const tr = el("tr", r.name===state.highlightRider?"highlight":"");
    const team = getTeam(r.name);
    const tc = TEAM_COLORS[team] || TEAM_COLORS.default;
    const jerseyId = "jersey_"+team;
    const imgSrc = state.jerseyImages[team];

    const dnfRaces = r.dnfRaces || [];
    const dnfHtml = r.dnf > 0
      ? `<span class="dnf-badge" title="${dnfRaces.join(", ")}">${r.dnf}</span>`
      : `<span style="color:var(--t3)">—</span>`;

    tr.innerHTML = `
      <td style="padding:8px 10px">
        <div class="jersey" style="background:${tc[0]}" id="${jerseyId}" title="${team} (klik om afbeelding te uploaden)">
          ${imgSrc ? `<img src="${imgSrc}" alt="${team}">` : `<span style="color:${tc[1]}">${team.substring(0,2).toUpperCase()}</span>`}
          <input type="file" accept="image/*" data-team="${team}" title="Upload jersey voor ${team}">
        </div>
      </td>
      <td style="font-weight:${r.points>100?500:400}">
        ${r.joker ? `<span class="badge" style="background:#FAC77533;color:#BA7517;margin-right:4px">joker</span>` : ""}
        ${r.name}
        <div style="font-size:11px;color:var(--t2)">${mgr}</div>
      </td>
      <td><span class="team-badge" style="background:${tc[0]}22;color:${tc[0]}">${team}</span></td>
      <td class="r" style="color:var(--t2)">${r.cost.toFixed(1)}M</td>
      <td class="r" style="font-weight:500;color:${r.points>0?COLORS[mgr]:"var(--t2)"}">${r.points}</td>
      <td class="r" style="font-size:12px;color:var(--t2)">${r.costPerPoint ? fmt(r.costPerPoint) : "—"}</td>
      <td class="c">${dnfHtml}</td>`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  c.appendChild(wrap);

  // Jersey upload listeners (after DOM)
  setTimeout(() => {
    document.querySelectorAll('.jersey input[type=file]').forEach(inp => {
      inp.addEventListener('change', e => {
        const team = inp.dataset.team;
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          state.jerseyImages[team] = ev.target.result;
          saveState();
          render();
        };
        reader.readAsDataURL(file);
      });
    });
  }, 0);
}

// ---- RACES ----
function renderRaces(c) {
  state.races.forEach(race => {
    const wrap = el("div","race-item");
    const hdr = el("div","race-header");
    const isOpen = state.raceOpen[race.name];
    const allEntries = [...(race.finals||[]), ...(race.stages||[])];
    const riderCount = [...new Set(allEntries.map(e=>e.rider).filter(Boolean))].length;
    hdr.innerHTML = `
      <div>
        <div style="font-weight:500;font-size:14px">${race.name}</div>
        <div style="font-size:11px;color:var(--t2);margin-top:2px">${race.type||""} &bull; ${riderCount} renners gescoord</div>
        ${race.dnfs&&race.dnfs.length ? `<div class="dnf-list">DNF: ${race.dnfs.slice(0,4).join(", ")}${race.dnfs.length>4?"…":""}</div>` : ""}
      </div>
      <span class="chevron${isOpen?" open":""}">▼</span>`;
    hdr.onclick = () => { state.raceOpen[race.name] = !isOpen; render(); };
    wrap.appendChild(hdr);

    if (isOpen) {
      const body = el("div","race-body");

      if (race.finals && race.finals.length) {
        const sec = el("div","");
        sec.style.padding = "10px 16px 0";
        sec.innerHTML = `<div style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:6px">EINDKLASSEMENT</div>`;
        const tbl = el("table","tbl");
        tbl.style.marginBottom = "0";
        const tb = el("tbody","");
        race.finals.forEach((f, i) => {
          const m = getRiderManager(f.rider);
          const tr = el("tr","");
          tr.innerHTML = `
            <td style="width:32px;font-size:12px;color:var(--t2)">${f.pos||i+1}</td>
            <td class="clickable" style="font-weight:${f.pts>=40?500:400}">${f.rider}</td>
            <td>${m ? `<span class="badge" style="background:${COLORS[m]}22;color:${COLORS[m]}">${m}</span>` : ""}</td>
            <td class="r" style="font-weight:500">${f.pts}</td>`;
          if (m) {
            tr.querySelector("td.clickable").onclick = () => {
              state.tab="teams"; state.teamView=m; state.highlightRider=f.rider; render();
            };
          }
          tb.appendChild(tr);
        });
        tbl.appendChild(tb);
        sec.appendChild(tbl);
        body.appendChild(sec);
      }

      if (race.stages && race.stages.length) {
        const sec = el("div","");
        sec.style.cssText = "padding:10px 16px 0;margin-top:8px";
        sec.innerHTML = `<div style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:6px">ETAPPES</div>`;
        const tbl = el("table","tbl");
        const tb = el("tbody","");
        race.stages.forEach(s => {
          const m = getRiderManager(s.rider);
          const tr = el("tr","");
          tr.innerHTML = `
            <td style="width:56px;font-size:12px;color:var(--t2)">Et. ${s.stage}</td>
            <td class="clickable">${s.rider}</td>
            <td>${m ? `<span class="badge" style="background:${COLORS[m]}22;color:${COLORS[m]}">${m}</span>` : ""}</td>
            <td class="r" style="font-weight:500">${s.pts}</td>`;
          if (m) {
            tr.querySelector("td.clickable").onclick = () => {
              state.tab="teams"; state.teamView=m; state.highlightRider=s.rider; render();
            };
          }
          tb.appendChild(tr);
        });
        tbl.appendChild(tb);
        sec.appendChild(tbl);
        body.appendChild(sec);
      }

      const spacer = el("div",""); spacer.style.height="12px";
      body.appendChild(spacer);
      wrap.appendChild(body);
    }
    c.appendChild(wrap);
  });
}

// ---- FEED ----
function renderFeed(c) {
  // Compose
  const compose = el("div","compose");
  compose.innerHTML = `
    <div style="font-size:13px;font-weight:500;margin-bottom:10px">Nieuw bericht</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <select id="feed-who" style="flex:1;padding:7px 10px">
        <option value="">Kies je naam...</option>
        ${MANAGERS.map(m=>`<option value="${m}">${m}</option>`).join("")}
      </select>
    </div>
    <textarea id="feed-text" placeholder="Schrijf een bericht..." style="width:100%;padding:8px 10px;margin-bottom:8px;font-size:14px"></textarea>
    <button class="btn primary" id="feed-post">Versturen</button>`;
  c.appendChild(compose);

  setTimeout(() => {
    document.getElementById("feed-post").onclick = () => {
      const who = document.getElementById("feed-who").value;
      const text = document.getElementById("feed-text").value.trim();
      if (!who || !text) { alert("Kies een naam en schrijf een bericht."); return; }
      state.comments.unshift({ who, text, time: new Date().toLocaleString("nl-NL") });
      saveState();
      render();
    };
  },0);

  if (state.comments.length === 0) {
    const empty = el("div","empty-state");
    empty.innerHTML = `<div style="font-size:24px;margin-bottom:8px">💬</div><div>Nog geen berichten. Wees de eerste!</div>`;
    c.appendChild(empty);
    return;
  }

  state.comments.forEach(msg => {
    const d = el("div","feed-msg");
    d.innerHTML = `
      <div class="who" style="color:${COLORS[msg.who]||"var(--t1)"}">
        ${msg.who}<span class="when">${msg.time}</span>
      </div>
      <div class="text">${msg.text.replace(/\n/g,"<br>")}</div>`;
    c.appendChild(d);
  });
}

// ---- MODAL ----
function renderModal(app) {
  const bg = el("div","modal-bg");
  bg.onclick = e => { if(e.target===bg){state.adminModal=null;render();} };
  const modal = el("div","modal");

  const isEdit = state.adminModal === "editRace";
  const race = isEdit ? state.editingRace : {name:"",type:"1.UWT",finals:[],stages:[],dnfs:[]};

  modal.innerHTML = `<h2>${isEdit?"Race bewerken":"Race toevoegen"}</h2>`;

  // Name + type
  const r1 = el("div","form-row");
  r1.innerHTML = `<label>Race naam</label><input id="m-name" value="${race.name||""}" placeholder="bijv. Tour de France">`;
  modal.appendChild(r1);
  const r2 = el("div","form-row");
  r2.innerHTML = `<label>Type</label>
    <select id="m-type">
      ${["GT1","GT2","1.UWT","2.UWT","1.Pro","2.Pro","1.1"].map(t=>`<option value="${t}"${race.type===t?" selected":""}>${t}</option>`).join("")}
    </select>`;
  modal.appendChild(r2);

  // Finals
  const r3 = el("div","form-row");
  r3.innerHTML = `<label>Eindklassement (één per regel: positie,renner,punten)</label>
    <textarea id="m-finals" style="font-size:12px;font-family:monospace">${(race.finals||[]).map(f=>`${f.pos},${f.rider},${f.pts}`).join("\n")}</textarea>`;
  modal.appendChild(r3);

  // Stages
  const r4 = el("div","form-row");
  r4.innerHTML = `<label>Etappes (één per regel: etappe,renner,punten)</label>
    <textarea id="m-stages" style="font-size:12px;font-family:monospace">${(race.stages||[]).map(s=>`${s.stage},${s.rider},${s.pts}`).join("\n")}</textarea>`;
  modal.appendChild(r4);

  // DNFs
  const r5 = el("div","form-row");
  r5.innerHTML = `<label>DNFs (één renner per regel)</label>
    <textarea id="m-dnfs" style="font-size:12px;font-family:monospace;min-height:60px">${(race.dnfs||[]).join("\n")}</textarea>`;
  modal.appendChild(r5);

  // Buttons
  const btnRow = el("div","");
  btnRow.style.cssText = "display:flex;gap:8px;margin-top:16px";

  const saveBtn = el("button","btn primary");
  saveBtn.textContent = isEdit ? "Opslaan" : "Toevoegen";
  saveBtn.onclick = () => {
    const name = document.getElementById("m-name").value.trim();
    const type = document.getElementById("m-type").value;
    if (!name) { alert("Vul een naam in."); return; }

    const finals = document.getElementById("m-finals").value.trim().split("\n").filter(Boolean).map(l => {
      const [pos,rider,...rest] = l.split(",");
      return {pos:parseInt(pos), rider:rider?.trim(), pts:parseFloat(rest.join(","))};
    }).filter(f=>f.rider);

    const stages = document.getElementById("m-stages").value.trim().split("\n").filter(Boolean).map(l => {
      const [stage,rider,...rest] = l.split(",");
      return {stage:parseFloat(stage), rider:rider?.trim(), pts:parseFloat(rest.join(","))};
    }).filter(s=>s.rider);

    const dnfs = document.getElementById("m-dnfs").value.trim().split("\n").filter(Boolean).map(s=>s.trim());

    const newRace = {name, type, finals, stages, dnfs};

    if (isEdit) {
      state.races[race._idx] = newRace;
    } else {
      state.races.push(newRace);
    }

    // Recalculate rider points from all races
    recalcRiderPoints();
    saveState();
    state.adminModal = null;
    state.tab = "races";
    render();
  };
  btnRow.appendChild(saveBtn);

  const cancelBtn = el("button","btn");
  cancelBtn.textContent = "Annuleren";
  cancelBtn.onclick = () => { state.adminModal=null; render(); };
  btnRow.appendChild(cancelBtn);

  if (isEdit) {
    const delBtn = el("button","btn");
    delBtn.textContent = "Verwijderen";
    delBtn.style.cssText = "margin-left:auto;color:#D85A30;border-color:#D85A30";
    delBtn.onclick = () => {
      if (confirm(`Race "${race.name}" verwijderen?`)) {
        state.races.splice(race._idx, 1);
        recalcRiderPoints();
        saveState();
        state.adminModal = null;
        render();
      }
    };
    btnRow.appendChild(delBtn);
  }

  modal.appendChild(btnRow);
  bg.appendChild(modal);
  app.appendChild(bg);
}

function recalcRiderPoints() {
  // Reset all rider points to 0
  state.riders.forEach(r => { r.points = 0; r.dnf = 0; r.dnfRaces = []; });

  state.races.forEach(race => {
    // Finals points
    (race.finals||[]).forEach(f => {
      if (!f.rider) return;
      const r = findRider(f.rider);
      if (r) r.points += f.pts;
    });
    // Stage points
    (race.stages||[]).forEach(s => {
      if (!s.rider) return;
      const r = findRider(s.rider);
      if (r) r.points += s.pts;
    });
    // Special points (Giro etc)
    (race.special||[]).forEach(sp => {
      if (!sp.rider) return;
      const r = findRider(sp.rider);
      if (r) r.points += sp.pts;
    });
    // DNFs
    (race.dnfs||[]).forEach(name => {
      const r = findRider(name);
      if (r) { r.dnf = (r.dnf||0)+1; r.dnfRaces = r.dnfRaces||[]; r.dnfRaces.push(race.name); }
    });
  });

  // Recalc costPerPoint
  state.riders.forEach(r => {
    r.costPerPoint = (r.points > 0 && r.cost > 0) ? Math.round(r.cost/r.points*100000) : null;
  });
}

function findRider(name) {
  name = name.trim();
  let r = state.riders.find(rd => rd.name === name);
  if (r) return r;
  // fuzzy - first + last name match
  const parts = name.toLowerCase().split(" ");
  r = state.riders.find(rd => {
    const p = rd.name.toLowerCase().split(" ");
    return p[0] === parts[0] && p[p.length-1] === parts[parts.length-1];
  });
  return r || null;
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// Initial render
render();
</script>
